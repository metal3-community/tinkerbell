name: For each commit and PR
on:
  push:
    branches:
      - "main"
    tags:
      - "v**"
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}
  CGO_ENABLED: 0
  GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=10m
          version-file: .tool-versions

  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-only: true
          version-file: .tool-versions

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Run go mod tidy
        run: go mod tidy

      - name: Generate code and format
        run: |
          go generate ./...
          golangci-lint fmt ./...

      - name: Check for changes
        run: git diff --compact-summary --exit-code

  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Run all CI checks, linting, tests, etc
        run: make ci TEST_ARGS="-count=1"

      - name: Generate HTML coverage report
        if: always()
        run: go tool cover -html=coverage.txt -o coverage.html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.txt
            coverage.html

      - name: upload to codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  validate-helm-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: install helm
        uses: Azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Lint and Template Helm chart
        run: make helm-lint helm-template

  build-publish-container-images:
    runs-on: ubuntu-latest
    needs:
      - lint
      - validation
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: |
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        if: |
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        if: |
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: |
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v4.0.0

      - name: Set up GoReleaser environment variables
        id: goreleaser-env
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "args='release --clean'" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            echo "args='release --clean --skip=validate'" >> $GITHUB_OUTPUT
          else
            echo "args='build --clean --skip=validate'" >> $GITHUB_OUTPUT
          fi
          echo "GORELEASER_CURRENT_TAG=${GORELEASER_CURRENT_TAG}" >> $GITHUB_ENV
          echo "GORELEASER_PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match="v*" $(git describe --tags --abbrev=0 --match="v*" 2>/dev/null || true)^ 2>/dev/null || true)" >> $GITHUB_ENV
          echo "IS_RELEASE=${{ startsWith(github.ref, 'refs/tags/v') }}" >> $GITHUB_ENV

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: "${{ steps.goreleaser-env.outputs.args }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: tinkerbell
          path: dist/*

  package-publish-helm-chart:
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate-helm-chart
      - build-publish-container-images
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: install helm
        uses: Azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Package and publish the Helm chart
        run: make helm-publish
