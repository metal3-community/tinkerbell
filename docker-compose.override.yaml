# docker-compose.override.yaml is an automatic override applied when running
# `docker compose up`. This override scopes the stack down for local
# integration testing on hosts (e.g. macOS Docker Desktop) where the
# macvlan-based 02-dhcp-relay network cannot be created.
#
# The tinkerbell service drops its 02-dhcp-relay network attachment and
# binds only to the default bridge so the rest of the stack
# (etcd, kube-apiserver, kube-controller-manager, kubeconfig job)
# still comes up.
services:
  tinkerbell:
    networks:
      01-tinkerbell_default:
        # Static alias so the kube-apiserver can resolve the conversion
        # webhook by name when reaching it via the in-cluster URL.
        # The hostname matches the SAN in script/dev-webhook-cert.sh.
        aliases:
          - tinkerbell
    # Pin to the locally-built dev image so docker compose doesn't re-pull
    # the upstream image when the local one already exists.
    image: ghcr.io/tinkerbell/tinkerbell:dev
    pull_policy: never
    environment:
      # Enable the conversion webhook with the dev certs generated by
      # `make dev-webhook-cert`. The CA bundle is what the apiserver
      # uses to validate the webhook's TLS cert; the URL points at the
      # tinkerbell container via the alias above.
      TINKERBELL_ENABLE_CONVERSION_WEBHOOK: "true"
      TINKERBELL_CONVERSION_WEBHOOK_BIND_ADDR: ":9443"
      TINKERBELL_CONVERSION_WEBHOOK_CERT_FILE: /webhook-certs/tls.crt
      TINKERBELL_CONVERSION_WEBHOOK_KEY_FILE: /webhook-certs/tls.key
      TINKERBELL_CONVERSION_WEBHOOK_CA_BUNDLE_FILE: /webhook-certs/ca.crt
      TINKERBELL_CONVERSION_WEBHOOK_URL: https://tinkerbell:9443/convert
    volumes:
      - ./out/webhook-certs:/webhook-certs:ro

# Remove the macvlan network definition by re-declaring it as a no-op bridge.
# A bridge driver doesn't need PARENT_INTERFACE, so the stack starts without
# any env-var prerequisite. macvlan is only useful for real DHCP relay
# integration on Linux hosts; for webhook/CRD integration testing on macOS
# we don't need DHCP relay at all.
networks:
  02-dhcp-relay:
    driver: bridge
