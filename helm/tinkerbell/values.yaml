# TRUSTED_PROXIES=$(kubectl get nodes -o jsonpath='{.items[*].spec.podCIDR}' | tr ' ' ',')
# LB_IP=192.168.2.116=
# helm install tinkerbell tinkerbell/ --create-namespace --namespace tinkerbell --wait --set "trustedProxies={${TRUSTED_PROXIES}}" --set "publicIP=$LB_IP" --set "deployment.agentImageTag=latest" --set "deployment.imageTag=latest"
deployment:
  additionalEnvs: []
  # - name: MY_ENV_VAR
  #   value: "my-value"
  additionalArgs: []
  # - "--my-arg=my-value"
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: '{{ include "tinkerbell.fullname" . }}'
              app.kubernetes.io/instance: "{{ .Release.Name }}"
          topologyKey: kubernetes.io/hostname
  agentImage: ghcr.io/tinkerbell/tink-agent
  # agentImageTag is here as a placeholder and to show its possible to be set.
  # It is not set because in the deployment.yaml a coalesce is used with this value
  # and the .Chart.AppVersion. This allows CI and the release process to set the value properly.
  agentImageTag:
  annotations: {}
  daemonSet:
    enabled: false
  envs:
    globals:
      backend: "kube"
      backendFilePath: ""
      backendKubeBurst: 100
      backendKubeConfig: ""
      backendKubeNamespace: ""
      backendKubeQPS: 100
      bindAddr: ""
      enableCRDMigrations: true
      enableRufioController: true
      enableSecondstar: true
      enableSmee: true
      enableTootles: true
      enableTinkServer: true
      enableTinkController: true
      enableUI: true
      httpPort: 7080
      httpsPort: 7443
      logLevel: 0
      otelEndpoint: ""
      otelInsecure: false
      publicIpv4: ""
      tlsCertFile: ""
      tlsKeyFile: ""
      trustedProxies: ""
      maxprocsEnable: true
      memlimitRatio: 0.9
    rufio:
      bmcConnectTimeout: "2m0s"
      controllerEnableLeaderElection: true
      controllerLeaderElectionNamespace: '{{ include "tinkerbell.namespace" . }}'
      logLevel: 0
      maxConcurrentReconciles: 1
      powerCheckInterval: "30m0s"
    secondstar:
      port: 2222
      hostKey: ""
      ipmitoolPath: "/usr/sbin/ipmitool"
      idleTimeout: "15m"
      logLevel: 0
    osie:
      debugMode: false
      logLevel: 0
    dhcp:
      bindAddr: ""
      bindInterface: ""
      enabled: true
      enableNetbootOptions: true
      ipForPacket: ""
      ipxeHttpBinaryHost: ""
      ipxeHttpBinaryPath: "/ipxe/binary"
      ipxeHttpBinaryPort: 7080
      ipxeHttpBinaryScheme: "http"
      ipxeHttpScriptHost: ""
      ipxeHttpScriptPath: "/ipxe/script/auto.ipxe"
      ipxeHttpScriptPort: 7080
      ipxeHttpScriptPrependMac: true
      ipxeHttpScriptScheme: "http"
      mode: "reservation" # reservation, proxy, auto-proxy
      syslogIP: ""
      tftpIP: ""
      tftpPort: 69
    smee:
      logLevel: 0
    ipxe:
      binaryInjectMacAddrFormat: "" # one of colon, dot, dash, no-delimiter, empty. defaults to colon when empty.
      embeddedScriptPatch: ""
      httpBinaryEnabled: true
      httpScriptBindAddr: ""
      httpScriptEnabled: true
      httpScriptExtraKernelArgs: [] # Additional kernel arguments to pass to the OSIE. (k=v k=v) that are appended to the kernel cmdline in the iPXE script
      httpScriptInitrdName: "initramfs-6.18.16" # name of the initrd file to fetch in the iPXE script, defaults to initramfs, which becomes initramfs-<arch> in the script
      httpScriptKernelName: "vmlinuz-6.18.16" # name of the kernel file to fetch in the iPXE script, defaults to vmlinuz, which becomes vmlinuz-<arch> in the script
      httpScriptOsieUrl: ""
      httpScriptRetries: 1
      httpScriptRetryDelay: 1
      httpScriptTrustedProxies: ""
      overrideArchMapping: "" # a comma separated list of <arch>=<binary> pairs. See the iPXE Architecture Mapping documentation for more details.
      scriptTinkServerAddrPort: ""
      scriptTinkServerInsecureTls: false
      scriptTinkServerUseTls: false
    tftp:
      blockSize: 512
      serverBindAddr: ""
      serverBindPort: 69
      serverEnabled: true
      singlePort: true # if true, use single port mode for TFTP server
      timeout: "10s"
    syslog:
      bindAddr: ""
      bindPort: 514
      enabled: true
    iso:
      enabled: true
      patchMagicString: ""
      staticIpamEnabled: true
      upstreamUrl: ""
    https:
      bindPort: 7272
    dhcpInterface:
      enabled: false
    tinkController:
      enableLeaderElection: true
      leaderElectionNamespace: '{{ include "tinkerbell.namespace" . }}'
      logLevel: 0
      maxConcurrentReconciles: 1
      referenceAllowListRules: {}
      referenceDenyListRules: {}
    tinkServer:
      autoDiscoveryAutoEnrollmentEnabled: false
      autoDiscoveryEnabled: false
      autoDiscoveryNamespace: "" # defaults to the namespace in which Tinkerbell is deployed.
      autoEnrollmentEnabled: false
      bindAddr: ""
      bindPort: 42113
      logLevel: 0
    tootles:
      debugMode: false
      logLevel: 0
      instanceEndpoint: false # if true, Tootles will serve metadata at /tootles/instanceID/<instanceID> to _any_ client
    ui:
      debugMode: false
      enableAutoLogin: false
      logLevel: 0
      urlPrefix: "/"
  hostNetwork: false
  image: ghcr.io/tinkerbell/tinkerbell
  imagePullPolicy: IfNotPresent
  initContainers: []
  # imageTag is here as a placeholder and to show its possible to be set.
  # It is not set because in the deployment.yaml a coalesce is used with this value
  # and the .Chart.AppVersion. This allows CI and the release process to set the value properly.
  imageTag:
  init:
    enabled: false
    # if `interfaceMode: ipvlan`, then ghcr.io/jacobweinstock/relay-init:v0.1.0 (has nmap and nmap-scripts) is required. Otherwise, alpine can be used.
    image: ghcr.io/jacobweinstock/relay-init:v0.1.0
    # interfaceMode determines how we create the interface needed to listen for DHCP broadcast traffic.
    # by default macvlan is used. ipvlan is the only other option.
    interfaceMode: macvlan
    # sourceInterface is the Host/Node interface to use for listening for DHCP broadcast packets.
    # When unset, the interface from the default route will be used.
    # sourceInterface: eno1
  nodeSelector: {}
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 500m
      memory: 128Mi
  selector: {}
  strategy:
    type: RollingUpdate
  # Kubernetes probes configuration
  # Uses Smee's /healthcheck endpoint on the HTTP script server port (7171)
  probes:
    # Liveness probe - restarts the container if it fails
    liveness:
      enabled: true
      httpGet:
        path: /healthcheck
        port: http
        scheme: HTTP
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    # Readiness probe - removes pod from service endpoints if it fails
    readiness:
      enabled: true
      httpGet:
        path: /healthcheck
        port: http
        scheme: HTTP
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    # Startup probe - gives the container time to start before liveness kicks in
    startup:
      enabled: true
      httpGet:
        path: /healthcheck
        port: http
        scheme: HTTP
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 30
      successThreshold: 1
  tolerations: []
  topologySpreadConstraints: []
  # Additional volumes on the output Deployment definition.
  volumes:
    - name: captain-artifacts
      image:
        reference: ghcr.io/tinkerbell/captain/artifacts:v0.1.0
        pullPolicy: PullIfNotPresent

  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts:
    - name: captain-artifacts
      mountPath: /captain
  # - name: foo
  #   mountPath: "/etc/foo"
  #   subPath: "foo"
  #   readOnly: true
name: tinkerbell
publicIP:
rbac:
  additionalRoleRules: []
  # Resource-based rule example:
  # - apiGroups: [""]             # Required. API groups ("" = core group).
  #   resources: ["configmaps"]   # Required. Resource types.
  #   verbs: ["get", "list"]      # Required. Allowed operations.
  #   resourceNames: ["my-cm"]    # Optional. Restrict to specific resource names.
  # Non-resource URL rule example:
  # - nonResourceURLs: ["/healthz"] # Required. Non-resource URL paths.
  #   verbs: ["get"]                # Required. Allowed operations.
  create: true
  name: tinkerbell
  type: ClusterRole # or Role
  secrets:
    enabled: true
service:
  annotations: {}
  labels:
    app: tinkerbell
  lbClass: "kube-vip.io/kube-vip-class"
  loadBalancerIP: ""
  name: tinkerbell
  ports:
    dhcp:
      name: dhcp
      port: 67
      protocol: UDP
    grpc:
      name: grpc
      port: 42113
      protocol: TCP
    http:
      name: http
      port: 7080
      protocol: TCP
    ssh:
      name: ssh
      port: 2222
      protocol: TCP
    syslog:
      name: syslog
      port: 514
      protocol: UDP
    tftp:
      name: tftp
      port: 69
      protocol: UDP
    https:
      name: https
      port: 7443
      protocol: TCP
  selector:
    app: tinkerbell
  sessionAffinity: None
  sessionAffinityConfig: {}
  type: LoadBalancer
trustedProxies: []

# Enable creating the tinkerbell configmap
createConfigmap: true

optional:
  # enable migration to convert a 0.6.2 values.yaml to a v0.19.x values.yaml.
  # See the migration documentation for more details.
  # https://github.com/tinkerbell/tinkerbell/blob/main/docs/technical/HELM_VALUES_MIGRATION.md
  migration:
    enabled: false

  # captainos objects enable downloading and serving CaptainOS artifacts.
  # Optional, disabled by default.
  # Can be enabled together with hookos.
  captainos:
    enabled: false
    image: ghcr.io/tinkerbell/captain/artifacts:v0.1.0
    pullPolicy: IfNotPresent

  # kubevip objects are used to provide a LoadBalancer IP for the Tinkerbell services.
  # Optional, enabled by default.
  kubevip:
    # Additional environment variables to pass to the kubevip container. Each entry is expected to have a
    # name and value key. Some keys are already defined - refer to the deployment.yaml template for
    # details.
    #
    # Example
    #   - name: MY_ENV_VAR
    #     value: my-value
    additionalEnv: []
    enabled: false
    image: ghcr.io/kube-vip/kube-vip:v1.0.0
    imagePullPolicy: IfNotPresent
    # Customize the interface KubeVIP advertises on. When unset, KubeVIP will autodetect the interface.
    # interface: enp0s8
    name: kube-vip
    roleBindingName: kube-vip-rolebinding
    roleName: kube-vip-role
    nodeSelector: {}
    tolerations: []
    affinity: {}
