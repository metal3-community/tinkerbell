version: 2

env:
  - REGISTRY={{ envOrDefault "REGISTRY" "ghcr.io" }}
  - IS_RELEASE={{ envOrDefault "IS_RELEASE" "false" }}

git:
  ignore_tags:
    - api/v*
    - legacy-tink-v*

# Apache 2.0 section 4(d) attribution: stage per-arch THIRD_PARTY_LICENSES
# bundles before any binary is built so they can be shipped inside the
# container images via the docker build context. The script is shellcheck-
# able and runnable standalone (see script/third_party_licenses.sh).
before:
  hooks:
    - bash -c 'mkdir -p bin && GOBIN=$PWD/bin go install github.com/google/go-licenses/v2@v2.0.1'
    - bash script/third_party_licenses.sh amd64 out/THIRD_PARTY_LICENSES-linux-amd64 out/third_party/amd64 bin/go-licenses script/third_party_licenses_header.txt
    - bash script/third_party_licenses.sh arm64 out/THIRD_PARTY_LICENSES-linux-arm64 out/third_party/arm64 bin/go-licenses script/third_party_licenses_header.txt

builds:
  - id: tinkerbell
    env: ["CGO_ENABLED=0"]
    main: ./cmd/tinkerbell
    binary: tinkerbell
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    no_unique_dist_dir: false
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser
      - -extldflags '-static'
    skip: false

  - id: tinkerbell-embedded
    env: ["CGO_ENABLED=0"]
    main: ./cmd/tinkerbell
    binary: tinkerbell-embedded
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    tags:
      - embedded
    no_unique_dist_dir: false
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser
      - -extldflags '-static'
    skip: false

  - id: tink-agent
    env: ["CGO_ENABLED=0"]
    main: ./cmd/agent
    binary: tink-agent
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    no_unique_dist_dir: false
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser
      - -extldflags '-static'
    skip: false

upx:
  - enabled: true
    ids:
      - tinkerbell
      - tinkerbell-embedded
      - tink-agent
    compress: best
    lzma: true

checksum:
  name_template: "{{ .ArtifactName }}-checksums.txt"
  split: true

release:
  disable: true

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  disable: '{{ if eq .Env.IS_RELEASE "true" }}false{{ else }}true{{ end }}'

dockers_v2:
  - id: tinkerbell
    dockerfile: Dockerfile.tinkerbell
    extra_files:
      - LICENSE
      - out/THIRD_PARTY_LICENSES-linux-amd64
      - out/THIRD_PARTY_LICENSES-linux-arm64
    images:
      - '{{ .Env.REGISTRY }}/{{ envOrDefault "IMAGE_NAME" (trimsuffix (trimprefix .GitURL "https://github.com/") ".git") }}'
    tags:
      - '{{ if eq .Env.IS_RELEASE "true" }}v{{ .Version }}{{ end }}'
      - "{{ if .IsNightly }}edge{{ end }}"
      - "{{ if not .IsNightly }}latest{{ end }}"
      - '{{ if eq .Branch "main" }}sha-{{ .ShortCommit }}{{ end }}'
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "v{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"

  - id: tinkerbell-embedded
    dockerfile: Dockerfile.tinkerbell
    build_args:
      BINARY: tinkerbell-embedded
    extra_files:
      - LICENSE
      - out/THIRD_PARTY_LICENSES-linux-amd64
      - out/THIRD_PARTY_LICENSES-linux-arm64
    images:
      - '{{ .Env.REGISTRY }}/{{ envOrDefault "IMAGE_NAME" (trimsuffix (trimprefix .GitURL "https://github.com/") ".git") }}'
    tags:
      - '{{ if eq .Env.IS_RELEASE "true" }}v{{ .Version }}-embedded{{ end }}'
      - "{{ if .IsNightly }}edge{{ else }}latest{{ end }}-embedded"
      - '{{ if eq .Branch "main" }}embedded-sha-{{ .ShortCommit }}{{ end }}'
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "v{{.Version}}-embedded"
      "org.opencontainers.image.source": "{{.GitURL}}"

  - id: tink-agent
    dockerfile: Dockerfile.agent
    extra_files:
      - LICENSE
      - out/THIRD_PARTY_LICENSES-linux-amd64
      - out/THIRD_PARTY_LICENSES-linux-arm64
    images:
      - '{{ .Env.REGISTRY }}/{{ trimsuffix (envOrDefault "IMAGE_NAME" (trimsuffix (trimprefix .GitURL "https://github.com/") ".git")) .ProjectName }}tink-agent'
    tags:
      - '{{ if eq .Env.IS_RELEASE "true" }}v{{ .Version }}{{ end }}'
      - "{{ if .IsNightly }}edge{{ else }}latest{{ end }}"
      - '{{ if eq .Branch "main" }}sha-{{ .ShortCommit }}{{ end }}'
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "v{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"

docker_signs:
  - cmd: cosign
    args:
      - "sign"
      - "--yes"
      - "${artifact}@${digest}"
